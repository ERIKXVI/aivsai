name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
      dry_run:
        description: "Build and package only; upload the zip as an artifact instead of publishing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The tag comes from user input: pass it through the environment (never splice it into the
      # script) and accept only vMAJOR.MINOR.PATCH[-suffix], so later steps can use it safely.
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          name="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag '$name' is not of the form vMAJOR.MINOR.PATCH[-suffix]"; exit 1
          fi
          # The tag must match project(VERSION), which also stamps the exe's version resource.
          # CRLF-safe: Windows runners check out with autocrlf, so do not anchor on '$'.
          ver=$(sed -n 's/^[[:space:]]*VERSION[[:space:]][[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)
          base="${name#v}"; base="${base%%-*}"
          if [[ "$base" != "$ver" ]]; then
            echo "::error::Tag $name does not match project VERSION '$ver' in CMakeLists.txt"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/PrimaMateria | Out-Null
          Copy-Item build/Release/PrimaMateria.exe dist/PrimaMateria/
          Copy-Item README.md dist/PrimaMateria/README.md
          Compress-Archive -Path dist/PrimaMateria -DestinationPath "PrimaMateria-${{ steps.tag.outputs.name }}-windows-x64.zip"

      - name: Upload package (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: PrimaMateria-${{ steps.tag.outputs.name }}-windows-x64
          path: PrimaMateria-${{ steps.tag.outputs.name }}-windows-x64.zip

      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Prima Materia ${{ steps.tag.outputs.name }}
          body_path: docs/RELEASE_NOTES.md
          # A suffixed tag (v1.0.0-rc.1) is a pre-release and never displaces the latest release.
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: PrimaMateria-${{ steps.tag.outputs.name }}-windows-x64.zip
          fail_on_unmatched_files: true
