name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
      dry_run:
        description: "Build and package only; upload the zip as an artifact instead of publishing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/PrimaMateria | Out-Null
          Copy-Item build/Release/PrimaMateria.exe dist/PrimaMateria/
          Copy-Item README.md dist/PrimaMateria/README.md
          Compress-Archive -Path dist/PrimaMateria -DestinationPath "PrimaMateria-${{ steps.tag.outputs.name }}-windows-x64.zip"

      - name: Upload package (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PrimaMateria-${{ steps.tag.outputs.name }}-windows-x64
          path: PrimaMateria-${{ steps.tag.outputs.name }}-windows-x64.zip

      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Prima Materia ${{ steps.tag.outputs.name }}
          body_path: docs/RELEASE_NOTES.md
          files: PrimaMateria-${{ steps.tag.outputs.name }}-windows-x64.zip
          fail_on_unmatched_files: true
