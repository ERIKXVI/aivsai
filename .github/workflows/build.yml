name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
    # Documentation-only changes need no build (and save Actions minutes).
    paths-ignore: ["**.md", "docs/**", ".editorconfig"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".editorconfig"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository; uploading artifacts needs no token scope.
permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/PrimaMateria | Out-Null
          Copy-Item build/Release/PrimaMateria.exe dist/PrimaMateria/
          Copy-Item README.md dist/PrimaMateria/README.md -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v6
        with:
          name: PrimaMateria-windows-x64
          path: dist/PrimaMateria

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux (Clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # libclang-rt-dev holds the sanitizer runtimes; Ubuntu's clang package does not pull it in.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libclang-rt-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DPM_SANITIZE=ON -DPM_BUILD_TOOLS=OFF -DPM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
